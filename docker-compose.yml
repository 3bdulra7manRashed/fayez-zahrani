version: "3.8"

services:
    web:
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        environment:
            - APP_KEY=${APP_KEY:-}
        volumes:
            - sqlite_data:/var/www/html/database/data
            - storage_public:/var/www/html/storage/app/public

volumes:
    sqlite_data:
    storage_public:
